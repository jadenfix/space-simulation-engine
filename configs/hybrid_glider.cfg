# Coupled mission-scale stress scenario. This intentionally enables every
# currently supported spacecraft force path; it is a software integration
# case, not a claim that the selected hardware parameters are realizable.
integrator = dopri54
controller = sun_cone
start_time_s = 0
duration_s = 604800
step_s = 30
min_step_s = 0.01
max_step_s = 600
absolute_tolerance = 1e-6
relative_tolerance = 1e-10
output_every_steps = 20

position_m = 149597870700, 0, 0
velocity_m_s = 0, 29784.6918, 0
mass_kg = 25
sail_area_m2 = 144
sail_reflectivity = 0.88
sail_absorptivity = 0.12
sun_cone_angle_deg = 20

spacecraft_charge_c = 0.001
tether_length_m = 30000
tether_voltage_v = 25000
electric_sail_cd = 0.8
electric_sail_cl = 0.25
electric_sail_max_radius_m = 300
magnetic_dipole_a_m2 = 2e8
magnetic_sail_cd = 0.8
magnetic_sail_cl = 0.15
magnetic_sail_max_radius_m = 5000

wind_proton_temperature_k = 800000
wind_electron_temperature_k = 800000
wind_density_1au_m3 = 5000000
wind_radial_b_1au_t = 3e-9
wind_stream_fraction = 0.2
wind_stream_arms = 2
seed = 20260816

enable_gravity = true
enable_j2 = false
enable_1pn = true
enable_radiation_pressure = true
enable_electric_sail = true
enable_magnetic_sail = true
enable_lorentz_force = true
