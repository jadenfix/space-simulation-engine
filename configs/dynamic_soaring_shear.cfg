# Falsification-oriented local shear-layer experiment near 1 AU.
# The planar shear is an explicit synthetic boundary, not a claim about a universal medium.
integrator = rk4
controller = dynamic_soar
duration_s = 604800
step_s = 5
min_step_s = 0.001
max_step_s = 30
output_every_steps = 120

position_m = 149597870700, -600000000, 0
velocity_m_s = 0, 1500, 0
mass_kg = 12
sail_area_m2 = 0

tether_length_m = 50000
tether_voltage_v = 30000
electric_sail_cd = 0.4
electric_sail_cl = 1.2
electric_sail_max_radius_m = 500
soar_turn_distance_m = 400000000

wind_stream_fraction = 0
shear_enabled = true
shear_normal = 0, 1, 0
shear_offset_m = 0
shear_width_m = 50000000
shear_delta_speed_m_s = 300000
shear_flow_direction = 1, 0, 0

seed = 9
enable_gravity = false
enable_1pn = false
enable_radiation_pressure = false
enable_electric_sail = true
enable_magnetic_sail = false
enable_lorentz_force = false
