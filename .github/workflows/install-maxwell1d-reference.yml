name: install-maxwell1d-reference

on:
  push:
    branches:
      - agent/bootstrap-space-simulation-engine

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bootstrap-space-simulation-engine
          fetch-depth: 0

      - name: Integrate the independent Maxwell oracle
        shell: bash
        run: |
          set -euo pipefail
          test -f assurance/include/spacewind/em_pic1d.h
          test -f assurance/src/em_pic1d.c
          test -f assurance/tests/test_em_pic1d.c
          test -f assurance/include/spacewind/maxwell1d_reference.h
          test -f assurance/src/maxwell1d_reference.c
          test -f assurance/tests/test_maxwell1d_reference.c
          python3 - <<'PY'
          from pathlib import Path

          cmake = Path('assurance/CMakeLists.txt')
          text = cmake.read_text(encoding='utf-8')
          if 'src/maxwell1d_reference.c' not in text:
              anchor = '    src/spectral_poisson.c\n'
              if anchor not in text:
                  raise SystemExit('CMake source anchor not found')
              text = text.replace(
                  anchor,
                  anchor + '    src/maxwell1d_reference.c\n',
                  1,
              )
          if 'spacewind_assurance_maxwell1d_reference' not in text:
              anchor = (
                  'add_assurance_test(spacewind_assurance_spectral_poisson '
                  'tests/test_spectral_poisson.c)\n'
              )
              if anchor not in text:
                  raise SystemExit('CMake test anchor not found')
              text = text.replace(
                  anchor,
                  anchor +
                  'add_assurance_test(spacewind_assurance_maxwell1d_reference '
                  'tests/test_maxwell1d_reference.c)\n',
                  1,
              )
          cmake.write_text(text, encoding='utf-8')

          makefile = Path('assurance/Makefile')
          text = makefile.read_text(encoding='utf-8')
          if 'src/maxwell1d_reference.c' not in text:
              anchor = '\tsrc/spectral_poisson.c\n'
              if anchor not in text:
                  raise SystemExit('Make source anchor not found')
              text = text.replace(
                  anchor,
                  anchor.rstrip('\n') + ' \\\n\tsrc/maxwell1d_reference.c\n',
                  1,
              )
          line = next(
              value for value in text.splitlines()
              if value.startswith('TEST_NAMES :=')
          )
          if 'maxwell1d_reference' not in line.split():
              text = text.replace(
                  line,
                  line + ' maxwell1d_reference',
                  1,
              )
          makefile.write_text(text, encoding='utf-8')

          readme = Path('assurance/README.md')
          text = readme.read_text(encoding='utf-8')
          marker = '### Periodic transverse Maxwell oracle\n'
          if marker not in text:
              addition = '''### Periodic transverse Maxwell oracle

The direct-DFT 1D3V Maxwell reference translates right- and left-moving
characteristic fields exactly in the represented periodic basis. It audits
vacuum field energy, Poynting momentum, characteristic energies, time
reversal, polarization covariance, and prescribed-current midpoint work. Odd
grids are required so an unresolved collocated Nyquist mode cannot be silently
translated. See
[`docs/MAXWELL1D_SPECTRAL_REFERENCE.md`](../docs/MAXWELL1D_SPECTRAL_REFERENCE.md).

'''
              anchor = '### Cross-environment validity\n'
              if anchor not in text:
                  raise SystemExit('assurance README anchor not found')
              text = text.replace(anchor, addition + anchor, 1)
          readme.write_text(text, encoding='utf-8')

          root = Path('ASSURANCE.md')
          text = root.read_text(encoding='utf-8')
          link = (
              '- [`docs/MAXWELL1D_SPECTRAL_REFERENCE.md`]'
              '(docs/MAXWELL1D_SPECTRAL_REFERENCE.md)\n'
          )
          if link not in text:
              anchor = (
                  '- [`docs/SPECTRAL_POISSON_AUDIT.md`]'
                  '(docs/SPECTRAL_POISSON_AUDIT.md)\n'
              )
              if anchor not in text:
                  raise SystemExit('ASSURANCE.md link anchor not found')
              text = text.replace(anchor, anchor + link, 1)
          root.write_text(text, encoding='utf-8')
          PY
          rm -f .github/workflows/install-maxwell1d-reference.yml
          git diff --check

      - name: Strict GCC and full CTest matrix
        shell: bash
        run: |
          set -euo pipefail
          cmake -S assurance -B /tmp/build-gcc \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc \
            -DSPACEWIND_ASSURANCE_WERROR=ON
          cmake --build /tmp/build-gcc --parallel 2
          ctest --test-dir /tmp/build-gcc --output-on-failure

      - name: Strict Clang and sanitizer checks
        shell: bash
        run: |
          set -euo pipefail
          cmake -S assurance -B /tmp/build-clang \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DSPACEWIND_ASSURANCE_WERROR=ON
          cmake --build /tmp/build-clang --parallel 2
          ctest --test-dir /tmp/build-clang --output-on-failure
          cmake -S assurance -B /tmp/build-sanitized \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang \
            -DSPACEWIND_ASSURANCE_WERROR=ON \
            -DSPACEWIND_ASSURANCE_SANITIZERS=ON
          cmake --build /tmp/build-sanitized --parallel 2
          ASAN_OPTIONS=detect_leaks=1:strict_string_checks=1 \
          UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
            ctest --test-dir /tmp/build-sanitized --output-on-failure

      - name: Standalone Make and root regression
        shell: bash
        run: |
          set -euo pipefail
          make -C assurance clean test
          make clean
          make CFLAGS='-std=c11 -O2 -g -Wall -Wextra -Wpedantic -Wconversion -Wshadow -Wstrict-prototypes -Werror' all test

      - name: Commit validated integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: integrate independent periodic Maxwell oracle'
          git push origin HEAD:agent/bootstrap-space-simulation-engine
