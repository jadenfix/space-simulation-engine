name: repair-em-pic3d-transaction

on:
  push:
    branches:
      - agent/bootstrap-space-simulation-engine
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: repair-em-pic3d-transaction-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name == 'push' ||
       github.event.pull_request.head.ref == 'agent/bootstrap-space-simulation-engine')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bootstrap-space-simulation-engine
          fetch-depth: 0

      - name: Apply transactional step semantics and regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f'{path}: expected exactly one replacement anchor, found {count}'
                  )
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'assurance/include/spacewind/em_pic3d.h',
              '''    int field_work_passes;\n    int momentum_passes;\n    int passes;\n} swa_em_pic3d_result;''',
              '''    int field_work_passes;\n    int momentum_passes;\n    int state_committed;\n    int passes;\n} swa_em_pic3d_result;'''
          )

          replace_once(
              'assurance/src/em_pic3d_step.inc',
              '''    if (!out->finite) {\n        goto cleanup;\n    }\n    if (state->particle_count > 0U) {\n        memcpy(\n            state->particles, particle_final,\n            state->particle_count * sizeof(*particle_final)\n        );\n    }\n    memcpy(state->ex_V_m, ex_final, count * sizeof(double));\n    memcpy(state->ey_V_m, ey_final, count * sizeof(double));\n    memcpy(state->ez_V_m, ez_final, count * sizeof(double));\n    memcpy(state->bx_T, bx_final, count * sizeof(double));\n    memcpy(state->by_T, by_final, count * sizeof(double));\n    memcpy(state->bz_T, bz_final, count * sizeof(double));\n    ok = 1;''',
              '''    if (!out->finite) {\n        goto cleanup;\n    }\n    out->state_committed = 0;\n    if (out->passes) {\n        if (state->particle_count > 0U) {\n            memcpy(\n                state->particles, particle_final,\n                state->particle_count * sizeof(*particle_final)\n            );\n        }\n        memcpy(state->ex_V_m, ex_final, count * sizeof(double));\n        memcpy(state->ey_V_m, ey_final, count * sizeof(double));\n        memcpy(state->ez_V_m, ez_final, count * sizeof(double));\n        memcpy(state->bx_T, bx_final, count * sizeof(double));\n        memcpy(state->by_T, by_final, count * sizeof(double));\n        memcpy(state->bz_T, bz_final, count * sizeof(double));\n        out->state_committed = 1;\n    }\n    ok = 1;'''
          )

          replace_once(
              'assurance/src/em_pic3d_step.inc',
              '''        \"  \\\"local_current_passes\\\": %s,\\n\"\n        \"  \\\"spectral_oracle_passes\\\": %s,\\n\"\n        \"  \\\"passes\\\": %s,\\n\"''',
              '''        \"  \\\"local_current_passes\\\": %s,\\n\"\n        \"  \\\"spectral_oracle_passes\\\": %s,\\n\"\n        \"  \\\"state_committed\\\": %s,\\n\"\n        \"  \\\"passes\\\": %s,\\n\"'''
          )

          replace_once(
              'assurance/src/em_pic3d_step.inc',
              '''        result->local_current_passes ? \"true\" : \"false\",\n        result->spectral_oracle_passes ? \"true\" : \"false\",\n        result->passes ? \"true\" : \"false\"''',
              '''        result->local_current_passes ? \"true\" : \"false\",\n        result->spectral_oracle_passes ? \"true\" : \"false\",\n        result->state_committed ? \"true\" : \"false\",\n        result->passes ? \"true\" : \"false\"'''
          )

          test_insert = r'''
static void capture_field_state(
    const swa_em_pic3d *state,
    double *snapshot
) {
    const size_t bytes = state->cell_count * sizeof(double);
    memcpy(snapshot, state->ex_V_m, bytes);
    memcpy(snapshot + state->cell_count, state->ey_V_m, bytes);
    memcpy(snapshot + 2U * state->cell_count, state->ez_V_m, bytes);
    memcpy(snapshot + 3U * state->cell_count, state->bx_T, bytes);
    memcpy(snapshot + 4U * state->cell_count, state->by_T, bytes);
    memcpy(snapshot + 5U * state->cell_count, state->bz_T, bytes);
}

static int field_state_matches_snapshot(
    const swa_em_pic3d *state,
    const double *snapshot
) {
    const size_t bytes = state->cell_count * sizeof(double);
    return memcmp(state->ex_V_m, snapshot, bytes) == 0 &&
           memcmp(state->ey_V_m, snapshot + state->cell_count, bytes) == 0 &&
           memcmp(state->ez_V_m, snapshot + 2U * state->cell_count, bytes) == 0 &&
           memcmp(state->bx_T, snapshot + 3U * state->cell_count, bytes) == 0 &&
           memcmp(state->by_T, snapshot + 4U * state->cell_count, bytes) == 0 &&
           memcmp(state->bz_T, snapshot + 5U * state->cell_count, bytes) == 0;
}

static void test_transactional_step_acceptance(void) {
    swa_em_pic3d state;
    swa_em_pic3d_result result;
    swa_em_pic3d_limits limits = permissive_limits();
    double *snapshot = NULL;
    const size_t rejected_cells = 4U;
    const double rejected_dx = 1.0 / (double)rejected_cells;
    const double rejected_dt = 1.05 * rejected_dx /
        (SWA_C * sqrt(3.0));
    size_t index;

    memset(&state, 0, sizeof(state));
    check_true(
        swa_em_pic3d_init(
            &state,
            rejected_cells, rejected_cells, rejected_cells, 0U,
            1.0, 1.0, 1.0, rejected_dt
        ),
        "transactional rejected-step grid initializes"
    );
    fill_divergence_free_fields(&state);
    snapshot = calloc(6U * state.cell_count, sizeof(double));
    check_true(snapshot != NULL,
               "allocate rejected-step field snapshot");
    if (snapshot != NULL) {
        capture_field_state(&state, snapshot);
        limits.maximum_courant = 0.8;
        check_true(
            swa_em_pic3d_step(&state, &limits, &result),
            "rejected transactional step returns an audit receipt"
        );
        check_true(!result.passes && !result.state_committed,
                   "failed scientific gates do not commit candidate state");
        check_true(field_state_matches_snapshot(&state, snapshot),
                   "rejected 3D3V step preserves every field bit");
    }
    free(snapshot);
    swa_em_pic3d_destroy(&state);

    memset(&state, 0, sizeof(state));
    limits = permissive_limits();
    check_true(
        swa_em_pic3d_init(
            &state, 17U, 1U, 1U, 0U,
            1.0, 1000.0, 1000.0,
            0.20 * (1.0 / 17.0) / SWA_C
        ),
        "transactional accepted-step grid initializes"
    );
    initialize_plane_wave(&state, 0, 2U, 1.0, 1);
    snapshot = calloc(6U * state.cell_count, sizeof(double));
    check_true(snapshot != NULL,
               "allocate accepted-step field snapshot");
    if (snapshot != NULL) {
        capture_field_state(&state, snapshot);
        check_true(
            swa_em_pic3d_step(&state, &limits, &result),
            "accepted transactional step executes"
        );
        check_true(result.passes && result.state_committed,
                   "passing 3D3V step commits exactly one candidate state");
        check_true(!field_state_matches_snapshot(&state, snapshot),
                   "accepted 3D3V step advances the field state");
        for (index = 0U; index < state.cell_count; ++index) {
            check_true(isfinite(state.ex_V_m[index]) &&
                       isfinite(state.ey_V_m[index]) &&
                       isfinite(state.ez_V_m[index]) &&
                       isfinite(state.bx_T[index]) &&
                       isfinite(state.by_T[index]) &&
                       isfinite(state.bz_T[index]),
                       "committed transactional state remains finite");
        }
    }
    free(snapshot);
    swa_em_pic3d_destroy(&state);
}

'''
          replace_once(
              'assurance/tests/test_em_pic3d.c',
              '\nint main(void) {',
              '\n' + test_insert + 'int main(void) {'
          )
          replace_once(
              'assurance/tests/test_em_pic3d.c',
              '''    test_coupled_3d3v_reference();\n    test_fail_closed_gates();''',
              '''    test_coupled_3d3v_reference();\n    test_fail_closed_gates();\n    test_transactional_step_acceptance();'''
          )

          doc_anchor = '''## Fail-closed gates\n'''
          doc_insert = '''## Transactional step acceptance\n\nThe timestep is evaluated into candidate particle and field buffers. The public\nstate is committed only when every declared acceptance gate passes. A finite\nrejected step still returns its complete diagnostic receipt, but leaves all\nparticle and field bytes unchanged. Internal errors likewise leave the state\nunchanged. The receipt exposes `state_committed` so callers cannot confuse a\ncomputed candidate with an accepted physical trajectory point.\n\nThis prevents a failed CFL, continuity, Gauss, magnetic-divergence, current,\nnonlinear, energy, momentum, or subluminal gate from contaminating subsequent\nsteps.\n\n'''
          replace_once(
              'docs/EM_PIC3D_REFERENCE.md',
              doc_anchor,
              doc_insert + doc_anchor
          )

          claims_path = Path('claims/em-pic3d-claims.json')
          claims = json.loads(claims_path.read_text(encoding='utf-8'))
          claims['version'] = '0.2.0'
          target = next(
              item for item in claims['claims']
              if item['id'] == 'SW-EM3D-0004'
          )
          suffix = (
              ' Rejected finite timesteps are additionally required to preserve '
              'the complete public particle and field state bit-for-bit; only a '
              'fully passing receipt may commit the candidate state.'
          )
          if suffix.strip() not in target['statement']:
              target['statement'] += suffix
          claims_path.write_text(
              json.dumps(claims, indent=2) + '\n',
              encoding='utf-8'
          )
          PY
          git diff --check
          python3 -m json.tool claims/em-pic3d-claims.json >/dev/null

      - name: Strict GCC and Clang validation
        shell: bash
        run: |
          set -euo pipefail
          for compiler in gcc clang; do
            rm -rf "/tmp/transaction-$compiler"
            cmake -S assurance -B "/tmp/transaction-$compiler" \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_COMPILER="$compiler" \
              -DSPACEWIND_ASSURANCE_WERROR=ON
            cmake --build "/tmp/transaction-$compiler" --parallel 2
            ctest --test-dir "/tmp/transaction-$compiler" --output-on-failure
          done
          make -C assurance clean test
          make clean
          make CFLAGS='-std=c11 -O2 -g -Wall -Wextra -Wpedantic -Wconversion -Wshadow -Wstrict-prototypes -Werror' all test

      - name: Sanitizers and static analysis
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/transaction-sanitized
          cmake -S assurance -B /tmp/transaction-sanitized \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang \
            -DSPACEWIND_ASSURANCE_SANITIZERS=ON \
            -DSPACEWIND_ASSURANCE_WERROR=ON
          cmake --build /tmp/transaction-sanitized --parallel 2
          ASAN_OPTIONS=detect_leaks=1:strict_string_checks=1 \
          UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
            ctest --test-dir /tmp/transaction-sanitized --output-on-failure
          clang --analyze -std=c11 -Wall -Wextra -Wpedantic \
            -Iassurance/include assurance/src/em_pic3d.c
          gcc -std=c11 -O0 -Wall -Wextra -Wpedantic -Wconversion -Wshadow \
            -Wstrict-prototypes -fanalyzer -Iassurance/include \
            -c assurance/src/em_pic3d.c -o /tmp/em_pic3d_transaction.o

      - name: Deterministic replay
        shell: bash
        run: |
          set -euo pipefail
          rm -f assurance/output/*.json
          ctest --test-dir /tmp/transaction-gcc --output-on-failure
          find assurance/output -maxdepth 1 -name '*.json' -print0 | sort -z | \
            xargs -0 sha256sum > /tmp/transaction-first.sha256
          rm -f assurance/output/*.json
          ctest --test-dir /tmp/transaction-gcc --output-on-failure
          find assurance/output -maxdepth 1 -name '*.json' -print0 | sort -z | \
            xargs -0 sha256sum > /tmp/transaction-second.sha256
          diff -u /tmp/transaction-first.sha256 /tmp/transaction-second.sha256

      - name: Publish verified transactional semantics
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/repair-em-pic3d-transaction.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: make 3D3V PIC step acceptance transactional'
          git pull --rebase origin agent/bootstrap-space-simulation-engine
          git push origin HEAD:agent/bootstrap-space-simulation-engine
