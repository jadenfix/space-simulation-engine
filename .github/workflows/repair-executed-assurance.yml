name: repair-executed-assurance

on:
  push:
    branches:
      - agent/bootstrap-space-simulation-engine
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: repair-executed-assurance
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bootstrap-space-simulation-engine
          fetch-depth: 0

      - name: Apply scale-aware conservation repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old!r}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'assurance/src/maxwell1d_reference.c',
              '''    momentum_scale = max3(\n        fabs(out->field_momentum_initial_Ns),\n        fabs(out->field_momentum_final_Ns),\n        DBL_MIN\n    );''',
              '''    momentum_scale = max3(\n        fabs(out->field_momentum_initial_Ns),\n        fabs(out->field_momentum_final_Ns),\n        max2(out->field_energy_initial_J,\n             out->field_energy_final_J) / SWA_C\n    );'''
          )

          replace_once(
              'assurance/tests/test_covariant_em.c',
              '''        check_true(relative_scalar(\n                       force.component[0],\n                       swa_vdot(e, current) / SWA_C) < 2.0e-14,\n                   "four-force time component equals J dot E over c");''',
              '''        {\n            const double expected_power_density =\n                swa_vdot(e, current) / SWA_C;\n            const double power_scale = max3(\n                fabs(force.component[0]),\n                fabs(expected_power_density),\n                swa_vnorm(e) * swa_vnorm(current) / SWA_C\n            );\n            check_true(\n                fabs(force.component[0] - expected_power_density) <=\n                    128.0 * DBL_EPSILON * max2(power_scale, DBL_MIN),\n                "four-force time component equals J dot E over c"\n            );\n        }'''
          )

          replace_once(
              'assurance/tests/test_covariant_em.c',
              '''        check_true(relative_scalar(\n                       force.component[1],\n                       rho * e.x + swa_vcross(current, b).x) < 2.0e-14,\n                   "four-force spatial x equals Lorentz force density");''',
              '''        {\n            const double expected_force_x =\n                rho * e.x + swa_vcross(current, b).x;\n            const double force_scale = max3(\n                fabs(force.component[1]),\n                fabs(expected_force_x),\n                fabs(rho) * swa_vnorm(e) +\n                    swa_vnorm(current) * swa_vnorm(b)\n            );\n            check_true(\n                fabs(force.component[1] - expected_force_x) <=\n                    128.0 * DBL_EPSILON * max2(force_scale, DBL_MIN),\n                "four-force spatial x equals Lorentz force density"\n            );\n        }'''
          )

          replace_once(
              'assurance/tests/test_covariant_em.c',
              '''    check_true(fabs(diagnostics.\n                       invariant_B2_minus_E2_over_c2_T2) < 1.0e-24,\n               "plane-wave first field invariant vanishes");''',
              '''    {\n        const double invariant_scale =\n            swa_vdot(wave.magnetic_field_T, wave.magnetic_field_T) +\n            swa_vdot(wave.electric_field_V_m, wave.electric_field_V_m) /\n                (SWA_C * SWA_C);\n        check_true(\n            fabs(diagnostics.invariant_B2_minus_E2_over_c2_T2) <=\n                128.0 * DBL_EPSILON * max2(invariant_scale, DBL_MIN),\n            "plane-wave first field invariant vanishes"\n        );\n    }'''
          )

          replace_once(
              'assurance/tests/test_maxwell_covariant_integration.c',
              '''    momentum_error = relative_scalar(\n        integrated.component[1], momentum\n    );''',
              '''    momentum_error = fabs(integrated.component[1] - momentum) /\n        max3(fabs(integrated.component[1]), fabs(momentum),\n             max2(energy / SWA_C, DBL_MIN));'''
          )

          replace_once(
              'assurance/tests/test_maxwell_covariant_integration.c',
              '''    characteristic_momentum_error = relative_scalar(\n        momentum, (right_energy - left_energy) / SWA_C\n    );''',
              '''    {\n        const double characteristic_momentum =\n            (right_energy - left_energy) / SWA_C;\n        characteristic_momentum_error =\n            fabs(momentum - characteristic_momentum) /\n            max3(fabs(momentum), fabs(characteristic_momentum),\n                 max2(energy / SWA_C, DBL_MIN));\n    }'''
          )

          replace_once(
              'assurance/tests/test_fdtd_spectral_integration.c',
              '    enum { CELLS = 33 };',
              '    enum { CELLS = 33, ADVERSARY_STEPS = 7 };'
          )
          replace_once(
              'assurance/tests/test_fdtd_spectral_integration.c',
              '''    for (step = 0U; step < CELLS; ++step) {\n        sw_fdtd1d_step(&correct);\n        sw_fdtd1d_step(&wrong);\n    }''',
              '''    for (step = 0U; step < ADVERSARY_STEPS; ++step) {\n        sw_fdtd1d_step(&correct);\n        sw_fdtd1d_step(&wrong);\n    }'''
          )
          replace_once(
              'assurance/tests/test_fdtd_spectral_integration.c',
              '''            x_m, (double)CELLS * dt_s, length_m, 3U''',
              '''            x_m, (double)ADVERSARY_STEPS * dt_s, length_m, 3U'''
          )
          PY
          git diff --check

      - name: Validate complete executed assurance graph
        shell: bash
        run: |
          set -euo pipefail
          for compiler in gcc clang; do
            rm -rf "/tmp/repair-$compiler"
            cmake -S assurance -B "/tmp/repair-$compiler" \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_COMPILER="$compiler" \
              -DSPACEWIND_ASSURANCE_WERROR=ON
            cmake --build "/tmp/repair-$compiler" --parallel 2
            ctest --test-dir "/tmp/repair-$compiler" --output-on-failure
          done
          make -C assurance clean test
          make clean
          make CFLAGS='-std=c11 -O2 -g -Wall -Wextra -Wpedantic -Wconversion -Wshadow -Wstrict-prototypes -Werror' all test

      - name: Validate under sanitizers
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/repair-sanitized
          cmake -S assurance -B /tmp/repair-sanitized \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang \
            -DSPACEWIND_ASSURANCE_SANITIZERS=ON \
            -DSPACEWIND_ASSURANCE_WERROR=ON
          cmake --build /tmp/repair-sanitized --parallel 2
          ASAN_OPTIONS=detect_leaks=1:strict_string_checks=1 \
          UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
            ctest --test-dir /tmp/repair-sanitized --output-on-failure

      - name: Publish verified repair
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/repair-executed-assurance.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: close executed Maxwell and covariant assurance'
          git pull --rebase origin agent/bootstrap-space-simulation-engine
          git push origin HEAD:agent/bootstrap-space-simulation-engine
