name: repair-assurance-unused

on:
  push:
    branches:
      - agent/bootstrap-space-simulation-engine
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bootstrap-space-simulation-engine
          fetch-depth: 0

      - name: Apply minimal fail-closed source repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"expected one exact match in {path}; found {count}: {old!r}"
                  )
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "assurance/src/invariants.c",
              "static double safe_scale(double x) { return max2(fabs(x), DBL_MIN); }\n",
              "",
          )
          replace_once(
              "assurance/src/invariants.c",
              "static double vector_relative_error(swa_vec3 observed, swa_vec3 expected) {\n"
              "    return swa_vnorm(swa_vsub(observed, expected)) /\n"
              "           max3(swa_vnorm(observed), swa_vnorm(expected), DBL_MIN);\n"
              "}\n",
              "",
          )
          replace_once(
              "assurance/src/experiment.c",
              "static double min2(double a, double b) { return a < b ? a : b; }\n",
              "",
          )
          replace_once(
              "assurance/src/physics.c",
              "    double position_error,velocity_error,energy_state_error,phase_error;\n",
              "    double position_error,velocity_error,phase_error;\n",
          )
          replace_once(
              "assurance/src/physics.c",
              "    energy_state_error=fabs(a->end.stored_energy_J-a->start.stored_energy_J)/safe_scale(a->energy_scale_J,1.0);\n",
              "",
          )
          replace_once(
              "assurance/src/physics.c",
              "    o->normalized_state_closure=max2(max2(position_error,velocity_error),max2(energy_state_error,phase_error));\n",
              "    o->normalized_state_closure=max2(max2(position_error,velocity_error),phase_error);\n",
          )
          replace_once(
              "assurance/src/experiment.c",
              "    o->interval_overlap = maximum_lower <= minimum_upper;\n",
              "    o->interval_overlap = maximum_lower <= minimum_upper +\n"
              "        a->maximum_relative_heterogeneity *\n"
              "        max2(fabs(o->pooled_effect_N), DBL_MIN);\n",
          )
          PY
          git diff --check

      - name: Compile assurance and robustness with warnings as errors
        shell: bash
        run: |
          set -euo pipefail
          cmake -S assurance -B /tmp/build-assurance \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc \
            -DSPACEWIND_ASSURANCE_WERROR=ON
          cmake --build /tmp/build-assurance --parallel 2
          cmake -S assurance/robustness -B /tmp/build-robustness \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc
          cmake --build /tmp/build-robustness --parallel 2

      - name: Commit source repair for the normal CI matrix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assurance/src/invariants.c assurance/src/experiment.c assurance/src/physics.c
          git diff --cached --check
          git commit -m 'fix: repair assurance closure contracts'
          git push origin HEAD:agent/bootstrap-space-simulation-engine
