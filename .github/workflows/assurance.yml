name: spacewind-assurance

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict:
    name: assurance-${{ matrix.os }}-${{ matrix.compiler }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
          - os: ubuntu-latest
            compiler: clang
          - os: macos-14
            compiler: clang
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S assurance -B build-assurance
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=${{ matrix.compiler }}
          -DSPACEWIND_ASSURANCE_WERROR=ON
      - name: Build
        run: cmake --build build-assurance --parallel 2
      - name: Test
        run: ctest --test-dir build-assurance --output-on-failure
      - name: Validate JSON receipts
        run: |
          for receipt in assurance/output/*.json; do
            python3 -m json.tool "$receipt" >/dev/null
          done

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure ASan and UBSan
        run: >-
          cmake -S assurance -B build-assurance-sanitized
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang
          -DSPACEWIND_ASSURANCE_SANITIZERS=ON
          -DSPACEWIND_ASSURANCE_WERROR=ON
      - name: Build
        run: cmake --build build-assurance-sanitized --parallel 2
      - name: Test under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:check_initialization_order=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-assurance-sanitized --output-on-failure

  deterministic-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build assurance tests
        run: |
          cmake -S assurance -B build-assurance -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc
          cmake --build build-assurance --parallel 2
      - name: First deterministic run
        run: |
          rm -f assurance/output/*.json
          ctest --test-dir build-assurance --output-on-failure
          find assurance/output -maxdepth 1 -name '*.json' -print0 | sort -z | xargs -0 sha256sum > /tmp/receipts-first.sha256
      - name: Replay and compare receipts
        run: |
          rm -f assurance/output/*.json
          ctest --test-dir build-assurance --output-on-failure
          find assurance/output -maxdepth 1 -name '*.json' -print0 | sort -z | xargs -0 sha256sum > /tmp/receipts-second.sha256
          diff -u /tmp/receipts-first.sha256 /tmp/receipts-second.sha256

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clang static analyzer
        run: |
          mkdir -p /tmp/clang-analysis
          for source in assurance/src/*.c; do
            clang --analyze -std=c11 -Wall -Wextra -Wpedantic -Iassurance/include \
              -Xanalyzer -analyzer-output=text "$source" -o /tmp/clang-analysis/$(basename "$source").plist
          done
      - name: GCC analyzer
        run: |
          mkdir -p /tmp/gcc-analysis
          for source in assurance/src/*.c; do
            gcc -std=c11 -O0 -Wall -Wextra -Wpedantic -Wconversion -Wshadow \
              -Wstrict-prototypes -fanalyzer -Iassurance/include -c "$source" \
              -o /tmp/gcc-analysis/$(basename "$source").o
          done

  root-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preserve original engine regression suite
        run: |
          make clean
          make CFLAGS='-std=c11 -O2 -g -Wall -Wextra -Wpedantic -Wconversion -Wshadow -Wstrict-prototypes -Werror' all test
          make examples

  plasma-mode-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize exact staged benchmark
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            agent/stage-3d3v-plasma-mode:refs/remotes/origin/agent/stage-3d3v-plasma-mode
          test "$(git rev-parse origin/agent/stage-3d3v-plasma-mode)" = \
            'd7854806f4d524bc9e65faf16fc400519377fe8c'
          : > /tmp/plasma.b64
          for part in 00 01 02a 02b 03a 03b; do
            git show \
              "origin/agent/stage-3d3v-plasma-mode:.github/plasma-mode-payload-v2/part-$part" \
              >> /tmp/plasma.b64
          done
          python3 - <<'PY'
          import base64
          from pathlib import Path
          raw = b''.join(Path('/tmp/plasma.b64').read_bytes().split())
          Path('/tmp/plasma.tar.gz').write_bytes(base64.b64decode(raw, validate=True))
          PY
          rm -rf /tmp/plasma-payload
          mkdir -p /tmp/plasma-payload
          tar -xzf /tmp/plasma.tar.gz -C /tmp/plasma-payload
          cp -a /tmp/plasma-payload/. .
      - name: Instrument first rejected gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('assurance/tests/test_em_pic3d_plasma_modes.c')
          text = path.read_text(encoding='utf-8')
          old = '''        if (!swa_em_pic3d_step(&state, &limits, &step_result) ||
            !step_result.finite ||
            !step_result.passes ||
            !step_result.state_committed) {
            goto cleanup;
        }
'''
          new = '''        {
            const int step_executed =
                swa_em_pic3d_step(&state, &limits, &step_result);
            if (!step_executed || !step_result.finite ||
                !step_result.passes || !step_result.state_committed) {
                fprintf(stderr,
                    "DIAG step=%zu exec=%d finite=%d passes=%d committed=%d "
                    "flags[cfl=%d pcfl=%d q=%d cont=%d g0=%d g1=%d d0=%d d1=%d "
                    "proj=%d local=%d spectral=%d mean=%d nonlinear=%d sublum=%d "
                    "energy=%d pwork=%d fwork=%d mom=%d] "
                    "metrics[cfl=%.17g disp=%.17g cont=%.17g g0=%.17g g1=%.17g "
                    "d0=%.17g d1=%.17g local=%.17g spectral=%.17g nonlinear=%.17g "
                    "energy=%.17g pwork=%.17g fwork=%.17g mom=%.17g speed=%.17g]\\n",
                    step, step_executed, step_result.finite,
                    step_result.passes, step_result.state_committed,
                    step_result.courant_passes,
                    step_result.particle_courant_passes,
                    step_result.charge_closure_passes,
                    step_result.continuity_passes,
                    step_result.initial_gauss_passes,
                    step_result.final_gauss_passes,
                    step_result.initial_magnetic_divergence_passes,
                    step_result.final_magnetic_divergence_passes,
                    step_result.current_projection_passes,
                    step_result.local_current_passes,
                    step_result.spectral_oracle_passes,
                    step_result.mean_current_passes,
                    step_result.nonlinear_passes,
                    step_result.subluminal_passes,
                    step_result.energy_passes,
                    step_result.particle_work_passes,
                    step_result.field_work_passes,
                    step_result.momentum_passes,
                    step_result.courant_number,
                    step_result.maximum_particle_displacement_cells,
                    step_result.continuity_relative_max,
                    step_result.initial_gauss_relative_max,
                    step_result.final_gauss_relative_max,
                    step_result.initial_magnetic_divergence_relative,
                    step_result.final_magnetic_divergence_relative,
                    step_result.local_current_difference_relative,
                    step_result.spectral_oracle_difference_relative,
                    step_result.nonlinear_relative_residual,
                    step_result.total_energy_relative,
                    step_result.particle_work_relative,
                    step_result.field_work_relative,
                    step_result.total_momentum_relative,
                    step_result.maximum_speed_fraction_c);
                goto cleanup;
            }
        }
'''
          if text.count(old) != 1:
              raise SystemExit('step block mismatch')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Build and run diagnostic benchmark
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/plasma-diag
          cmake -S assurance -B /tmp/plasma-diag \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=gcc \
            -DSPACEWIND_ASSURANCE_WERROR=ON
          cmake --build /tmp/plasma-diag --target \
            spacewind_assurance_em_pic3d_plasma_modes --parallel 2
          cd assurance
          /tmp/plasma-diag/spacewind_assurance_em_pic3d_plasma_modes
