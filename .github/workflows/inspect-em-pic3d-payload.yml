name: inspect-em-pic3d-payload

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect:
    if: github.event.pull_request.head.ref == 'agent/bootstrap-space-simulation-engine'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bootstrap-space-simulation-engine

      - name: Recover archive and report exact manifest
        shell: bash
        run: |
          set -euo pipefail
          cat .github/em-pic3d-payload/part-* | tr -d '[:space:]' > /tmp/em-pic3d-payload.b64
          echo '333c209f4d62580eb64d467f861a1fd097ac44bceec57b82884da05fe924e3a5  /tmp/em-pic3d-payload.b64' | sha256sum -c -
          base64 -d /tmp/em-pic3d-payload.b64 > /tmp/em-pic3d-payload.tar.gz
          echo 'a485197b14e46ba84d1f458bcd4c48e5405d9646e64977df779575145d6a4355  /tmp/em-pic3d-payload.tar.gz' | sha256sum -c -
          python3 - <<'PY'
          import hashlib
          import io
          from pathlib import Path, PurePosixPath
          import struct
          import tarfile
          import zlib

          data = Path('/tmp/em-pic3d-payload.tar.gz').read_bytes()
          position = 10
          flags = data[3]
          if flags & 0x04:
              extra = struct.unpack_from('<H', data, position)[0]
              position += 2 + extra
          for bit in (0x08, 0x10):
              if flags & bit:
                  end = data.find(b'\x00', position, len(data) - 8)
                  if end < 0:
                      raise SystemExit('unterminated gzip optional field')
                  position = end + 1
          if flags & 0x02:
              position += 2
          decoder = zlib.decompressobj(-zlib.MAX_WBITS)
          payload = decoder.decompress(data[position:-8]) + decoder.flush()
          if not decoder.eof:
              raise SystemExit('deflate stream incomplete')

          expected = {
              'ASSURANCE.md': '599a41e0dd16a8951872c8501cd6e6481ace2c1179799a1e8ae49c51f535c8c3',
              'assurance/CMakeLists.txt': '9a61ac3fa3e6563561b55b70ad833c3f50b9e0fa933ffdbc64408fb466e9ec5b',
              'assurance/Makefile': '32a494149d86dc53cdb3242fa778a1038c4555001d5d286ab68c0f8e2b8d0781',
              'assurance/README.md': '0727d6ed09b63eaf22ecbbff1948a7105a668ec584649eadf4ef1bcbd549c348',
              'assurance/include/spacewind/em_pic3d.h': 'bc8b172eb1fce07cc51690565a828571cea94485feae0ede4f5f8428ec032a92',
              'assurance/include/spacewind/four_momentum_delta.h': '2efbc8d563244a46add319e4401828ce7e48caa5230a5c24a47075e2bf4ffc5a',
              'assurance/src/em_pic3d.c': 'bdbc1a7a09e50f6834ab3900151772f457860a7f55e828880ffa910dec1523cb',
              'assurance/src/em_pic3d_deposition.inc': '3179e6e52e6812827965e380353c081d823413b4ef0988f53fb8d6395ba7b2e1',
              'assurance/src/em_pic3d_diagnostics.inc': '5f2de371aec13559457e0bc4d875b34c94899f424f81687fc3cd2c0c9e7d3fff',
              'assurance/src/em_pic3d_spectral.inc': '88cc41ccf3d36d90d89ecd60df4abd352a44dc385b683040ebe048265f393a33',
              'assurance/src/em_pic3d_step.inc': 'e50977ab76e240f39fb72610266d5733a20e449d99bde6e42cada2c44aa72cc7',
              'assurance/src/em_pic3d_support.inc': 'bd24f52367e4beb00961ac49a419b25caeb3276b89e900c8e56e40786f8039c3',
              'assurance/src/four_momentum_delta.c': 'bc6de02348f9edbd8614183027b4555a567d14e32736a0bce3bb62ecf841d943',
              'assurance/tests/test_em_pic3d.c': 'e5b8b22a333d58da972d7f58eb43975d322e51b359a98a22fef8dfabf63365f2',
              'assurance/tests/test_em_pic3d_covariant_integration.c': '6d5605f497f78164a21d5dd271eff4182e53996c093898c110d8eaa9c465f0b5',
              'claims/em-pic3d-claims.json': '1c2719e8caf2d0627ed06821fe41bb6c0b5014cbf1afe33356ce88cb17f54dcf',
              'claims/em-pic3d-covariant-integration-claims.json': '0f085d7b2d78c7d3d9ab39938b102bd22243f7de7d138451d3fcc9fed4f154f4',
              'claims/four-momentum-delta-claims.json': 'fc40322fdd1c904a4ff55f517fc9f70decfc76c508ca2ae534525fbd42e8316f',
              'docs/EM_PIC3D_COVARIANT_INTEGRATION.md': '08138c66458efdea6fa5613781ce1f208bd4d108ecb239d9fdab25d7851a55ff',
              'docs/EM_PIC3D_REFERENCE.md': '9c039437fe910fb74691562179d76d9dbb24e147c9a6071844bb78a3da5c70f3',
              'docs/FOUR_MOMENTUM_DELTA_LEDGER.md': '4263eb838ed9a07e270b43469d54677b7d440ca8103af7b263e729d8c590332d',
          }
          actual = {}
          readme = None
          with tarfile.open(fileobj=io.BytesIO(payload), mode='r:') as archive:
              for member in archive.getmembers():
                  if not member.isfile():
                      continue
                  name = member.name
                  while name.startswith('./'):
                      name = name[2:]
                  path = PurePosixPath(name).as_posix()
                  source = archive.extractfile(member)
                  if source is None:
                      raise SystemExit(f'cannot read {path}')
                  content = source.read()
                  actual[path] = hashlib.sha256(content).hexdigest()
                  if path == 'assurance/README.md':
                      readme = content

          for path in sorted(expected):
              observed = actual.get(path, '<missing>')
              status = 'OK' if observed == expected[path] else 'MISMATCH'
              print(f'{status} {path} expected={expected[path]} actual={observed}')
          extras = sorted(set(actual) - set(expected))
          missing = sorted(set(expected) - set(actual))
          print(f'extras={extras}')
          print(f'missing={missing}')
          if readme is None:
              raise SystemExit('README is missing')
          print('--- recovered assurance/README.md begin ---')
          print(readme.decode('utf-8', errors='strict'), end='')
          print('--- recovered assurance/README.md end ---')
          PY

      - name: Compare recovered README with tracked README
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import io
          from pathlib import Path
          import struct
          import tarfile
          import zlib

          data = Path('/tmp/em-pic3d-payload.tar.gz').read_bytes()
          position = 10
          flags = data[3]
          if flags & 0x04:
              extra = struct.unpack_from('<H', data, position)[0]
              position += 2 + extra
          for bit in (0x08, 0x10):
              if flags & bit:
                  position = data.find(b'\x00', position, len(data) - 8) + 1
          if flags & 0x02:
              position += 2
          decoder = zlib.decompressobj(-zlib.MAX_WBITS)
          payload = decoder.decompress(data[position:-8]) + decoder.flush()
          with tarfile.open(fileobj=io.BytesIO(payload), mode='r:') as archive:
              member = archive.getmember('./assurance/README.md')
              source = archive.extractfile(member)
              Path('/tmp/recovered-assurance-README.md').write_bytes(source.read())
          PY
          diff -u assurance/README.md /tmp/recovered-assurance-README.md || true
