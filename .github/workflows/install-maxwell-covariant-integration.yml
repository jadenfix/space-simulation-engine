name: install-maxwell-covariant-integration

on:
  push:
    branches:
      - agent/bootstrap-space-simulation-engine

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bootstrap-space-simulation-engine
          fetch-depth: 0

      - name: Integrate Maxwell to covariant stress-energy check
        shell: bash
        run: |
          set -euo pipefail
          test -f assurance/tests/test_maxwell_covariant_integration.c
          test -f assurance/include/spacewind/maxwell1d_reference.h
          test -f assurance/include/spacewind/covariant_em.h
          python3 - <<'PY'
          from pathlib import Path

          cmake = Path('assurance/CMakeLists.txt')
          text = cmake.read_text(encoding='utf-8')
          if 'spacewind_assurance_maxwell_covariant_integration' not in text:
              anchor = (
                  'add_assurance_test(spacewind_assurance_covariant_em '
                  'tests/test_covariant_em.c)\n'
              )
              if anchor not in text:
                  anchor = (
                      'add_assurance_test(spacewind_assurance_core '
                      'tests/test_assurance.c)\n'
                  )
              if anchor not in text:
                  raise SystemExit('CMake test anchor missing')
              text = text.replace(
                  anchor,
                  anchor +
                  'add_assurance_test('
                  'spacewind_assurance_maxwell_covariant_integration '
                  'tests/test_maxwell_covariant_integration.c)\n',
                  1,
              )
          cmake.write_text(text, encoding='utf-8')

          makefile = Path('assurance/Makefile')
          text = makefile.read_text(encoding='utf-8')
          line = next(
              value for value in text.splitlines()
              if value.startswith('TEST_NAMES :=')
          )
          if 'maxwell_covariant_integration' not in line.split():
              text = text.replace(
                  line,
                  line + ' maxwell_covariant_integration',
                  1,
              )
          makefile.write_text(text, encoding='utf-8')

          root = Path('ASSURANCE.md')
          text = root.read_text(encoding='utf-8')
          link = (
              '- [`docs/MAXWELL_COVARIANT_INTEGRATION.md`]'
              '(docs/MAXWELL_COVARIANT_INTEGRATION.md)\n'
          )
          if link not in text:
              anchor = (
                  '- [`docs/COVARIANT_STRESS_ENERGY.md`]'
                  '(docs/COVARIANT_STRESS_ENERGY.md)\n'
              )
              if anchor not in text:
                  raise SystemExit('ASSURANCE covariant link anchor missing')
              text = text.replace(anchor, anchor + link, 1)
          root.write_text(text, encoding='utf-8')

          readme = Path('assurance/README.md')
          text = readme.read_text(encoding='utf-8')
          sentence = (
              'The periodic Maxwell reference is also integrated through this '
              'tensor and compared against its independently accumulated '
              'energy and Poynting momentum; see '
              '[`docs/MAXWELL_COVARIANT_INTEGRATION.md`]'
              '(../docs/MAXWELL_COVARIANT_INTEGRATION.md).\n'
          )
          if sentence not in text:
              anchor = (
                  '[`docs/COVARIANT_STRESS_ENERGY.md`]'
                  '(../docs/COVARIANT_STRESS_ENERGY.md).\n'
              )
              if anchor not in text:
                  raise SystemExit('assurance README covariant anchor missing')
              text = text.replace(anchor, anchor + sentence, 1)
          readme.write_text(text, encoding='utf-8')
          PY
          rm -f .github/workflows/install-maxwell-covariant-integration.yml
          git diff --check

      - name: Strict GCC complete assurance matrix
        shell: bash
        run: |
          set -euo pipefail
          cmake -S assurance -B /tmp/build-gcc \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc \
            -DSPACEWIND_ASSURANCE_WERROR=ON
          cmake --build /tmp/build-gcc --parallel 2
          ctest --test-dir /tmp/build-gcc --output-on-failure

      - name: Strict Clang and sanitizer verification
        shell: bash
        run: |
          set -euo pipefail
          cmake -S assurance -B /tmp/build-clang \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DSPACEWIND_ASSURANCE_WERROR=ON
          cmake --build /tmp/build-clang --parallel 2
          ctest --test-dir /tmp/build-clang --output-on-failure
          cmake -S assurance -B /tmp/build-sanitized \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang \
            -DSPACEWIND_ASSURANCE_WERROR=ON \
            -DSPACEWIND_ASSURANCE_SANITIZERS=ON
          cmake --build /tmp/build-sanitized --parallel 2
          ASAN_OPTIONS=detect_leaks=1:strict_string_checks=1 \
          UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
            ctest --test-dir /tmp/build-sanitized --output-on-failure \
            -R maxwell_covariant

      - name: Standalone Make and root regression
        shell: bash
        run: |
          set -euo pipefail
          make -C assurance clean test
          make clean
          make CFLAGS='-std=c11 -O2 -g -Wall -Wextra -Wpedantic -Wconversion -Wshadow -Wstrict-prototypes -Werror' all test

      - name: Commit validated integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'test: close Maxwell fields through covariant four-momentum'
          git push origin HEAD:agent/bootstrap-space-simulation-engine
