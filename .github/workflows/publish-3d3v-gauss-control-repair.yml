name: publish-3d3v-gauss-control-repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: publish-3d3v-gauss-control-repair
  cancel-in-progress: false

jobs:
  validate-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bootstrap-space-simulation-engine
          fetch-depth: 0

      - name: Replace the non-neutral periodic-Gauss adversary with an isolated control
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('assurance/tests/em_pic3d_plasma_modes_parts')
          paths = [root / f'part_{index:02d}.inc' for index in range(8)]
          chunks = [path.read_text(encoding='utf-8') for path in paths]
          source = ''.join(chunks)
          start_marker = 'static int same_sign_charge_control_rejected('
          start = source.find(start_marker)
          if start < 0:
              raise SystemExit('same-sign control function not found')
          next_function = source.find('\nstatic ', start + len(start_marker))
          if next_function < 0:
              raise SystemExit('next function after same-sign control not found')

          replacement = r'''static int same_sign_charge_control_rejected(
              double density_m3,
              double dt_s
          ) {
              swa_em_pic3d state;
              const double macro_weight = density_m3;
              const double represented_charge_C =
                  SWA_QE * macro_weight;
              const double charge_tolerance_C = fmax(
                  1.0e-13 * fabs(represented_charge_C), 1.0e-30
              );
              int initialized;
              int configured;
              int gauss_initialized;

              memset(&state, 0, sizeof(state));
              initialized = swa_em_pic3d_init(
                  &state, 1U, 1U, 1U, 1U,
                  1.0, 1.0, 1.0, dt_s
              );
              if (!initialized) {
                  return 0;
              }
              configured = swa_em_pic3d_set_particle(
                  &state, 0U,
                  swa_v3(0.5, 0.5, 0.5),
                  swa_v3(0.0, 0.0, 0.0),
                  SWA_QE, SWA_MP, macro_weight
              );
              gauss_initialized = configured ?
                  swa_em_pic3d_initialize_gauss_field(
                      &state, swa_v3(0.0, 0.0, 0.0),
                      charge_tolerance_C
                  ) : 0;
              swa_em_pic3d_destroy(&state);
              return configured && !gauss_initialized;
          }
          '''
          source = source[:start] + replacement + source[next_function + 1:]

          # Keep the split translation unit easy to review while ensuring that
          # include boundaries only occur at complete line boundaries.
          target = len(source) // len(paths)
          new_chunks = []
          cursor = 0
          for index in range(len(paths) - 1):
              split = source.find('\n', cursor + target)
              if split < 0:
                  raise SystemExit('could not find a safe split boundary')
              split += 1
              new_chunks.append(source[cursor:split])
              cursor = split
          new_chunks.append(source[cursor:])
          for path, chunk in zip(paths, new_chunks):
              path.write_text(chunk, encoding='utf-8')
          PY
          git diff --check
          grep -R -q 'represented_charge_C' \
            assurance/tests/em_pic3d_plasma_modes_parts

      - name: Strict GCC and Clang complete assurance graphs
        shell: bash
        run: |
          set -euo pipefail
          for compiler in gcc clang; do
            rm -rf "/tmp/gauss-control-$compiler"
            cmake -S assurance -B "/tmp/gauss-control-$compiler" \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_COMPILER="$compiler" \
              -DSPACEWIND_ASSURANCE_WERROR=ON
            cmake --build "/tmp/gauss-control-$compiler" --parallel 2
            ctest --test-dir "/tmp/gauss-control-$compiler" \
              --output-on-failure
          done

      - name: Deterministic receipt replay
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/gauss-control-replay
          cmake -S assurance -B /tmp/gauss-control-replay \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc \
            -DSPACEWIND_ASSURANCE_WERROR=ON
          cmake --build /tmp/gauss-control-replay --parallel 2
          rm -f assurance/output/*.json
          ctest --test-dir /tmp/gauss-control-replay --output-on-failure
          find assurance/output -maxdepth 1 -name '*.json' -print0 \
            | sort -z | xargs -0 sha256sum > /tmp/receipts-first.sha256
          rm -f assurance/output/*.json
          ctest --test-dir /tmp/gauss-control-replay --output-on-failure
          find assurance/output -maxdepth 1 -name '*.json' -print0 \
            | sort -z | xargs -0 sha256sum > /tmp/receipts-second.sha256
          diff -u /tmp/receipts-first.sha256 /tmp/receipts-second.sha256

      - name: Standalone Make, root regression, and sanitizers
        shell: bash
        run: |
          set -euo pipefail
          make -C assurance clean test
          make clean
          make CFLAGS='-std=c11 -O2 -g -Wall -Wextra -Wpedantic -Wconversion -Wshadow -Wstrict-prototypes -Werror' all test
          rm -rf /tmp/gauss-control-sanitized
          cmake -S assurance -B /tmp/gauss-control-sanitized \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang \
            -DSPACEWIND_ASSURANCE_SANITIZERS=ON \
            -DSPACEWIND_ASSURANCE_WERROR=ON
          cmake --build /tmp/gauss-control-sanitized --parallel 2
          ASAN_OPTIONS=detect_leaks=1:strict_string_checks=1 \
          UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
            ctest --test-dir /tmp/gauss-control-sanitized \
              --output-on-failure

      - name: Static analyzers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gauss-clang-analysis /tmp/gauss-gcc-analysis
          for source in assurance/src/*.c; do
            clang --analyze -std=c11 -Wall -Wextra -Wpedantic \
              -Iassurance/include \
              -Xanalyzer -analyzer-output=text "$source" \
              -o "/tmp/gauss-clang-analysis/$(basename "$source").plist"
            gcc -std=c11 -O0 -Wall -Wextra -Wpedantic -Wconversion \
              -Wshadow -Wstrict-prototypes -fanalyzer \
              -Iassurance/include -c "$source" \
              -o "/tmp/gauss-gcc-analysis/$(basename "$source").o"
          done

      - name: Publish verified adversarial control and remove one-shot scaffolding
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/assurance.yml')
          text = path.read_text(encoding='utf-8')
          marker = '# BEGIN 3D3V_NONLINEAR_CONDITIONING_REPAIR\n'
          if marker in text:
              path.write_text(
                  text.split(marker, 1)[0].rstrip() + '\n',
                  encoding='utf-8'
              )
          PY
          rm -f \
            .github/workflows/publish-3d3v-gauss-control-repair.yml \
            .github/workflows/publish-3d3v-nonlinear-conditioning.yml \
            .github/workflows/repair-3d3v-nonlinear-conditioning.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'test: isolate non-neutral periodic Gauss rejection'
          git pull --rebase origin agent/bootstrap-space-simulation-engine
          git push origin HEAD:agent/bootstrap-space-simulation-engine
