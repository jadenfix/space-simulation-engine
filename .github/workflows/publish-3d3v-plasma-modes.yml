name: publish-3d3v-plasma-modes

on:
  push:
    branches:
      - agent/bootstrap-space-simulation-engine

permissions:
  contents: write

concurrency:
  group: publish-3d3v-plasma-modes
  cancel-in-progress: false

jobs:
  validate-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
