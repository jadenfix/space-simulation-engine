          git diff --check
          grep -q 'spacewind_assurance_em_pic3d_plasma_modes' assurance/CMakeLists.txt
          grep -q 'em_pic3d_plasma_modes' assurance/Makefile

      - name: Strict GCC and Clang assurance graphs
        shell: bash
        run: |
          set -euo pipefail
          for compiler in gcc clang; do
            rm -rf "/tmp/plasma-modes-$compiler"
            cmake -S assurance -B "/tmp/plasma-modes-$compiler" \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_COMPILER="$compiler" \
              -DSPACEWIND_ASSURANCE_WERROR=ON
            cmake --build "/tmp/plasma-modes-$compiler" --parallel 2
            ctest --test-dir "/tmp/plasma-modes-$compiler" --output-on-failure
          done

      - name: Standalone Make and root regression
        shell: bash
        run: |
          set -euo pipefail
          make -C assurance clean test
          python3 -m json.tool \
            assurance/output/em_pic3d_plasma_modes_receipt.json >/dev/null
          make clean
          make CFLAGS='-std=c11 -O2 -g -Wall -Wextra -Wpedantic -Wconversion -Wshadow -Wstrict-prototypes -Werror' all test

      - name: Sanitizer validation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/plasma-modes-sanitized
          cmake -S assurance -B /tmp/plasma-modes-sanitized \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang \
            -DSPACEWIND_ASSURANCE_SANITIZERS=ON \
            -DSPACEWIND_ASSURANCE_WERROR=ON
          cmake --build /tmp/plasma-modes-sanitized --parallel 2
          ASAN_OPTIONS=detect_leaks=1:strict_string_checks=1 \
          UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
            ctest --test-dir /tmp/plasma-modes-sanitized --output-on-failure

      - name: Show deterministic plasma-mode receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool \
            assurance/output/em_pic3d_plasma_modes_receipt.json

      - name: Publish only after unchanged gates pass
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/publish-3d3v-plasma-modes.yml
          git config user.name 'Jaden Fix'
          git config user.email '163031992+jadenfix@users.noreply.github.com'
          git add -A \
            assurance/CMakeLists.txt \
            assurance/Makefile \
            assurance/tests/test_em_pic3d_plasma_modes.c \
            .github/workflows/publish-3d3v-plasma-modes.yml
          git diff --cached --check
          git commit -m 'test: validate multi-period 3D3V plasma modes'
          git pull --rebase origin agent/bootstrap-space-simulation-engine
          git push origin HEAD:agent/bootstrap-space-simulation-engine
