name: install-em-pic1d-reference

on:
  push:
    branches:
      - agent/bootstrap-space-simulation-engine

permissions:
  contents: write

concurrency:
  group: install-em-pic1d-reference
  cancel-in-progress: false

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bootstrap-space-simulation-engine
          fetch-depth: 0

      - name: Reconstruct and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .github/em-pic1d-payload/part-* > /tmp/em-pic1d.tar.gz.b64
          echo 'b3eea4fbee92294cb536edc73a86ba3a6075341d87736db4e016cbd011bdc81b  /tmp/em-pic1d.tar.gz.b64' | sha256sum -c -
          base64 -d /tmp/em-pic1d.tar.gz.b64 > /tmp/em-pic1d.tar.gz
          echo '05d4ea0cb76142a192f72f98aecbc42c48792a00ba48cae2ef76064b80701998  /tmp/em-pic1d.tar.gz' | sha256sum -c -
          tar -xzf /tmp/em-pic1d.tar.gz -C .

      - name: Verify exact materialized files
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/em-pic1d.sha256 <<'SUMS'
          29c7d15e00388329ee63dd5e4f29f17cb416ac3024b7bf477fe3fc5e2650fffd  ./ASSURANCE.md
          9cfbf0dce48bf5ccc7653473dd3a4be8db33593a82f2939994c53dc70c86fad8  ./assurance/CMakeLists.txt
          c5432d85a9ccac70100ff6f113d18206614086d7fad24f13e16d1def811191b0  ./assurance/Makefile
          b917fb8db442427b3b8b72c5db0a0f8bcacbeeca3c18c82af081ca893bbefa16  ./assurance/README.md
          5a54fb6eee500230e96ee2b302fd6027b4f56979a06a1bfdaf192ddc1bcdc606  ./assurance/include/spacewind/em_pic1d.h
          e1e0f0bf8a6ce1d20c0dd04c3df325dc4119e04d06dbf9e747847de350fda18f  ./assurance/src/em_pic1d.c
          cf32308b56e46c67c2891a5d8b911460ad56090cda53f5e75d630d008b4afb63  ./assurance/src/em_pic1d_deposition.inc
          a650e8a066946107c55b3f36233eeb0f6801a9527d588ed2f87810972f2862b8  ./assurance/src/em_pic1d_diagnostics.inc
          6df9c7436d3be18cf87f330782e687de31770a00bd3ebe787af80f7c0fbd19e2  ./assurance/src/em_pic1d_receipt.inc
          d19a5278faff31a4e74e6d5072ead945c8c2eb34eded5cf6bef5e16a4fc4ae7d  ./assurance/src/em_pic1d_step.inc
          57f1c886178bcd3fda4cbb8a2c4e65036850c508b44e469b1d780db9f8cfd193  ./assurance/src/em_pic1d_support.inc
          93ccb422eb5ed5a30ec0b3ec5cbff1f0808d850ed163ce1e3f4d9cbd51382331  ./assurance/tests/test_em_pic1d.c
          16eacb9a39f2490a95466752350f5c53161e09d664021608f79f46449f2b64eb  ./claims/em-pic1d-claims.json
          ca96ce5029af0c3041e30bc8e830289e8a11e4018fa2a1e467bb2c9fc3a6e321  ./docs/EM_PIC1D_REFERENCE.md
          SUMS
          sha256sum -c /tmp/em-pic1d.sha256
          python3 -m json.tool claims/em-pic1d-claims.json >/dev/null
          git diff --check

      - name: Strict Make validation
        run: make -C assurance clean test

      - name: Independent CMake and CTest validation
        shell: bash
        run: |
          set -euo pipefail
          cmake -S assurance -B /tmp/build-assurance-em-pic -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc -DSPACEWIND_ASSURANCE_WERROR=ON
          cmake --build /tmp/build-assurance-em-pic --parallel 2
          ctest --test-dir /tmp/build-assurance-em-pic --output-on-failure

      - name: Sanitizer validation
        shell: bash
        run: |
          set -euo pipefail
          cmake -S assurance -B /tmp/build-assurance-em-pic-sanitized -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=clang -DSPACEWIND_ASSURANCE_SANITIZERS=ON -DSPACEWIND_ASSURANCE_WERROR=ON
          cmake --build /tmp/build-assurance-em-pic-sanitized --parallel 2
          ASAN_OPTIONS=detect_leaks=1:strict_string_checks=1 UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 ctest --test-dir /tmp/build-assurance-em-pic-sanitized --output-on-failure

      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/em-pic1d-payload .github/workflows/install-em-pic1d-reference.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ASSURANCE.md assurance/CMakeLists.txt assurance/Makefile assurance/README.md assurance/include/spacewind/em_pic1d.h assurance/src/em_pic1d.c assurance/src/em_pic1d_deposition.inc assurance/src/em_pic1d_diagnostics.inc assurance/src/em_pic1d_receipt.inc assurance/src/em_pic1d_step.inc assurance/src/em_pic1d_support.inc assurance/tests/test_em_pic1d.c claims/em-pic1d-claims.json docs/EM_PIC1D_REFERENCE.md
          git add -A .github/em-pic1d-payload .github/workflows/install-em-pic1d-reference.yml
          git diff --cached --check
          git commit -m 'feat: add verified 1D3V electromagnetic PIC reference'
          git push origin HEAD:agent/bootstrap-space-simulation-engine
