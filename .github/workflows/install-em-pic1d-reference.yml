name: install-em-pic1d-reference

on:
  push:
    branches:
      - agent/bootstrap-space-simulation-engine

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bootstrap-space-simulation-engine
          fetch-depth: 0

      - name: Materialize source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/em-pic1d.tar.gz.b64 <<'B64'
[...TRUNCATED...]
B64
          base64 -d /tmp/em-pic1d.tar.gz.b64 > /tmp/em-pic1d.tar.gz
          tar -xzf /tmp/em-pic1d.tar.gz -C .

      - name: Verify exact materialized files
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/em-pic1d.sha256 <<'SUMS'
29c7d15e00388329ee63dd5e4f29f17cb416ac3024b7bf477fe3fc5e2650fffd  ./ASSURANCE.md
9cfbf0dce48bf5ccc7653473dd3a4be8db33593a82f2939994c53dc70c86fad8  ./assurance/CMakeLists.txt
c08e376e4e17fb416c7b5f362a4f8eef3a61c6257f4b2d47a1cf66cad6632c05  ./assurance/Makefile
b917fb8db442427b3b8b72c5db0a0f8bcacbeeca3c18c82af081ca893bbefa16  ./assurance/README.md
5a54fb6eee500230e96ee2b302fd6027b4f56979a06a1bfdaf192ddc1bcdc606  ./assurance/include/spacewind/em_pic1d.h
7475ac974b2c623445436dea2e71c20202e3fe0e0c0328b7994cb0f5f5c9e7ce  ./assurance/src/em_pic1d.c
93ccb422eb5ed5a30ec0b3ec5cbff1f0808d850ed163ce1e3f4d9cbd51382331  ./assurance/tests/test_em_pic1d.c
16eacb9a39f2490a95466752350f5c53161e09d664021608f79f46449f2b64eb  ./claims/em-pic1d-claims.json
ca96ce5029af0c3041e30bc8e830289e8a11e4018fa2a1e467bb2c9fc3a6e321  ./docs/EM_PIC1D_REFERENCE.md
SUMS
          sha256sum -c /tmp/em-pic1d.sha256
          python3 -m json.tool claims/em-pic1d-claims.json >/dev/null
          git diff --check

      - name: Strict Make validation
        shell: bash
        run: |
          set -euo pipefail
          make -C assurance clean test

      - name: Independent CMake and CTest validation
        shell: bash
        run: |
          set -euo pipefail
          cmake -S assurance -B /tmp/build-assurance-em-pic \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc \
            -DSPACEWIND_ASSURANCE_WERROR=ON
          cmake --build /tmp/build-assurance-em-pic --parallel 2
          ctest --test-dir /tmp/build-assurance-em-pic --output-on-failure

      - name: Sanitizer validation
        shell: bash
        run: |
          set -euo pipefail
          cmake -S assurance -B /tmp/build-assurance-em-pic-sanitized \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang \
            -DSPACEWIND_ASSURANCE_SANITIZERS=ON \
            -DSPACEWIND_ASSURANCE_WERROR=ON
          cmake --build /tmp/build-assurance-em-pic-sanitized --parallel 2
          ASAN_OPTIONS=detect_leaks=1:strict_string_checks=1 \
          UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
            ctest --test-dir /tmp/build-assurance-em-pic-sanitized --output-on-failure

      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/install-em-pic1d-reference.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ASSURANCE.md assurance docs/EM_PIC1D_REFERENCE.md claims/em-pic1d-claims.json .github/workflows/install-em-pic1d-reference.yml
          git commit -m 'feat: add verified 1D3V electromagnetic PIC reference'
          git push origin HEAD:agent/bootstrap-space-simulation-engine
