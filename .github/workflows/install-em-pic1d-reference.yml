name: install-em-pic1d-reference

on:
  push:
    branches:
      - agent/bootstrap-space-simulation-engine

permissions:
  contents: write

concurrency:
  group: install-em-pic1d-reference
  cancel-in-progress: false

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bootstrap-space-simulation-engine
          fetch-depth: 0

      - name: Reconstruct immutable EM PIC payload
        shell: bash
        run: |
          set -euo pipefail
          cat .github/em-pic1d-payload/part-* > /tmp/em-pic1d.tar.gz.b64
          echo 'b3eea4fbee92294cb536edc73a86ba3a6075341d87736db4e016cbd011bdc81b  /tmp/em-pic1d.tar.gz.b64' | sha256sum -c -
          base64 -d /tmp/em-pic1d.tar.gz.b64 > /tmp/em-pic1d.tar.gz
          echo '05d4ea0cb76142a192f72f98aecbc42c48792a00ba48cae2ef76064b80701998  /tmp/em-pic1d.tar.gz' | sha256sum -c -
          rm -rf /tmp/em-pic-materialized
          mkdir -p /tmp/em-pic-materialized
          tar -xzf /tmp/em-pic1d.tar.gz -C /tmp/em-pic-materialized

      - name: Verify and copy only EM PIC-owned files
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/em-pic-materialized
          cat > /tmp/em-pic-module.sha256 <<'SUMS'
          5a54fb6eee500230e96ee2b302fd6027b4f56979a06a1bfdaf192ddc1bcdc606  ./assurance/include/spacewind/em_pic1d.h
          e1e0f0bf8a6ce1d20c0dd04c3df325dc4119e04d06dbf9e747847de350fda18f  ./assurance/src/em_pic1d.c
          cf32308b56e46c67c2891a5d8b911460ad56090cda53f5e75d630d008b4afb63  ./assurance/src/em_pic1d_deposition.inc
          a650e8a066946107c55b3f36233eeb0f6801a9527d588ed2f87810972f2862b8  ./assurance/src/em_pic1d_diagnostics.inc
          6df9c7436d3be18cf87f330782e687de31770a00bd3ebe787af80f7c0fbd19e2  ./assurance/src/em_pic1d_receipt.inc
          d19a5278faff31a4e74e6d5072ead945c8c2eb34eded5cf6bef5e16a4fc4ae7d  ./assurance/src/em_pic1d_step.inc
          57f1c886178bcd3fda4cbb8a2c4e65036850c508b44e469b1d780db9f8cfd193  ./assurance/src/em_pic1d_support.inc
          93ccb422eb5ed5a30ec0b3ec5cbff1f0808d850ed163ce1e3f4d9cbd51382331  ./assurance/tests/test_em_pic1d.c
          16eacb9a39f2490a95466752350f5c53161e09d664021608f79f46449f2b64eb  ./claims/em-pic1d-claims.json
          ca96ce5029af0c3041e30bc8e830289e8a11e4018fa2a1e467bb2c9fc3a6e321  ./docs/EM_PIC1D_REFERENCE.md
          SUMS
          sha256sum -c /tmp/em-pic-module.sha256
          cd "$GITHUB_WORKSPACE"
          install -D /tmp/em-pic-materialized/assurance/include/spacewind/em_pic1d.h assurance/include/spacewind/em_pic1d.h
          for file in em_pic1d.c em_pic1d_deposition.inc em_pic1d_diagnostics.inc em_pic1d_receipt.inc em_pic1d_step.inc em_pic1d_support.inc; do
            install -D "/tmp/em-pic-materialized/assurance/src/$file" "assurance/src/$file"
          done
          install -D /tmp/em-pic-materialized/assurance/tests/test_em_pic1d.c assurance/tests/test_em_pic1d.c
          install -D /tmp/em-pic-materialized/claims/em-pic1d-claims.json claims/em-pic1d-claims.json
          install -D /tmp/em-pic-materialized/docs/EM_PIC1D_REFERENCE.md docs/EM_PIC1D_REFERENCE.md
          python3 -m json.tool claims/em-pic1d-claims.json >/dev/null

      - name: Integrate with the current assurance graph
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          cmake = Path('assurance/CMakeLists.txt')
          text = cmake.read_text(encoding='utf-8')
          if 'src/em_pic1d.c' not in text:
              anchor = '    src/spectral_poisson.c\n'
              if anchor not in text:
                  raise SystemExit('CMake source anchor missing')
              text = text.replace(anchor, anchor + '    src/em_pic1d.c\n', 1)
          if 'spacewind_assurance_em_pic1d' not in text:
              anchor = 'add_assurance_test(spacewind_assurance_spectral_poisson tests/test_spectral_poisson.c)\n'
              if anchor not in text:
                  raise SystemExit('CMake test anchor missing')
              text = text.replace(anchor, anchor + 'add_assurance_test(spacewind_assurance_em_pic1d tests/test_em_pic1d.c)\n', 1)
          cmake.write_text(text, encoding='utf-8')

          makefile = Path('assurance/Makefile')
          text = makefile.read_text(encoding='utf-8')
          if 'src/em_pic1d.c' not in text:
              anchor = '\tsrc/spectral_poisson.c'
              if anchor not in text:
                  raise SystemExit('Make source anchor missing')
              text = text.replace(anchor, anchor + ' \\\n\tsrc/em_pic1d.c', 1)
          lines = text.splitlines()
          for idx, line in enumerate(lines):
              if line.startswith('TEST_NAMES :='):
                  names = line.split()[2:]
                  if 'em_pic1d' not in names:
                      lines[idx] = line + ' em_pic1d'
                  break
          else:
              raise SystemExit('TEST_NAMES line missing')
          makefile.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          assurance = Path('ASSURANCE.md')
          text = assurance.read_text(encoding='utf-8')
          link = '- [`docs/EM_PIC1D_REFERENCE.md`](docs/EM_PIC1D_REFERENCE.md)\n'
          if link not in text:
              anchor = '- [`docs/MAXWELL1D_SPECTRAL_REFERENCE.md`](docs/MAXWELL1D_SPECTRAL_REFERENCE.md)\n'
              if anchor not in text:
                  anchor = '- [`docs/SPECTRAL_POISSON_AUDIT.md`](docs/SPECTRAL_POISSON_AUDIT.md)\n'
              if anchor not in text:
                  raise SystemExit('ASSURANCE documentation anchor missing')
              text = text.replace(anchor, anchor + link, 1)
          assurance.write_text(text, encoding='utf-8')

          readme = Path('assurance/README.md')
          text = readme.read_text(encoding='utf-8')
          marker = '### Bounded 1D3V electromagnetic PIC reference\n'
          if marker not in text:
              addition = '''### Bounded 1D3V electromagnetic PIC reference

The independent `em_pic1d` reference couples three-velocity particles to
longitudinal and transverse electromagnetic fields on a periodic one-dimensional
mesh. It retains explicit unwrapped transport and exposes charge, current,
field-energy, particle-energy, and momentum diagnostics so higher-level
plasma-wing models cannot promote a result solely because a trajectory is
numerically stable. See
[`docs/EM_PIC1D_REFERENCE.md`](../docs/EM_PIC1D_REFERENCE.md).

'''
              anchor = '### Periodic transverse Maxwell oracle\n'
              if anchor not in text:
                  anchor = '### Cross-environment validity\n'
              if anchor not in text:
                  raise SystemExit('assurance README anchor missing')
              text = text.replace(anchor, addition + anchor, 1)
          readme.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Verify newer assurance layers remain present
        shell: bash
        run: |
          set -euo pipefail
          test -f assurance/include/spacewind/maxwell1d_reference.h
          test -f assurance/src/maxwell1d_reference.c
          test -f assurance/include/spacewind/covariant_em.h
          test -f assurance/src/covariant_em.c
          test -f assurance/tests/test_maxwell_covariant_integration.c
          grep -q 'src/maxwell1d_reference.c' assurance/CMakeLists.txt
          grep -q 'src/covariant_em.c' assurance/CMakeLists.txt
          grep -q 'src/em_pic1d.c' assurance/CMakeLists.txt

      - name: Strict GCC, Clang, CTest, and sanitizer validation
        shell: bash
        run: |
          set -euo pipefail
          for compiler in gcc clang; do
            rm -rf "/tmp/build-em-pic-$compiler"
            cmake -S assurance -B "/tmp/build-em-pic-$compiler" \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_COMPILER="$compiler" \
              -DSPACEWIND_ASSURANCE_WERROR=ON
            cmake --build "/tmp/build-em-pic-$compiler" --parallel 2
            ctest --test-dir "/tmp/build-em-pic-$compiler" --output-on-failure
          done
          rm -rf /tmp/build-em-pic-sanitized
          cmake -S assurance -B /tmp/build-em-pic-sanitized \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang \
            -DSPACEWIND_ASSURANCE_SANITIZERS=ON \
            -DSPACEWIND_ASSURANCE_WERROR=ON
          cmake --build /tmp/build-em-pic-sanitized --parallel 2
          ASAN_OPTIONS=detect_leaks=1:strict_string_checks=1 \
          UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
            ctest --test-dir /tmp/build-em-pic-sanitized --output-on-failure
          make -C assurance clean test
          make clean
          make CFLAGS='-std=c11 -O2 -g -Wall -Wextra -Wpedantic -Wconversion -Wshadow -Wstrict-prototypes -Werror' all test

      - name: Publish only after all gates pass
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/em-pic1d-payload
          rm -f .github/workflows/install-em-pic1d-reference.yml
          rm -f .github/workflows/install-maxwell1d-reference.yml
          rm -f .github/workflows/install-fdtd-spectral-crosscheck.yml
          rm -f .github/workflows/install-covariant-em-assurance.yml
          rm -f .github/workflows/install-maxwell-covariant-integration.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: materialize verified 1D3V electromagnetic PIC reference'
          git push origin HEAD:agent/bootstrap-space-simulation-engine
